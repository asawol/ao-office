<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6f8" />
<title>아사월 시청 · 비서실</title>
<meta name="description" content="아사월 시청 비서실의 3D 청사. 공간을 누르면 부서별 현황을 보고, AI 공무원과 바로 대화하세요." />
<meta property="og:title" content="아사월 시청 · 비서실" />
<meta property="og:description" content="아사월 시청 비서실 · 4개 부서가 근무하는 3D 청사" />
<meta property="og:image" content="assets/office-diorama.jpg" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231e2530'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial' font-size='32' font-weight='700' fill='%23fff' text-anchor='middle'%3E%EC%8B%9C%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css?v=20261129b" />
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brandMark" aria-hidden="true">市</span>
      <div class="brand-text">
        <h1>아사월 시청</h1>
        <p id="brandSub">시청 비서실 · 4개 부서 근무 중</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="live-pill is-connecting" id="livePill">
        <i class="dot" aria-hidden="true"></i><span id="liveText">연결 중</span>
      </span>
      <button type="button" class="icon-btn" id="inviteBtn" aria-label="초대 링크 복사" title="초대 링크 복사">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.1 0l2.4-2.4a5 5 0 0 0-7.1-7.1L11 4.9"/><path d="M14 11a5 5 0 0 0-7.1 0L4.5 13.4a5 5 0 0 0 7.1 7.1l1.4-1.4"/></svg>
      </button>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="설정" title="설정">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="시청 메뉴">
    <button type="button" class="tab is-active" role="tab" data-tab="office" aria-selected="true">청사</button>
    <button type="button" class="tab" role="tab" data-tab="meeting" aria-selected="false">회의실</button>
    <button type="button" class="tab" role="tab" data-tab="workshop" aria-selected="false">부서</button>
    <button type="button" class="tab" role="tab" data-tab="status" aria-selected="false">결재현황</button>
    <button type="button" class="tab" role="tab" data-tab="memo" aria-selected="false">지시메모</button>
  </nav>

  <main class="views">
    <section class="view view-office is-active" id="view-office" role="tabpanel" aria-label="청사"></section>
    <section class="view view-meeting" id="view-meeting" role="tabpanel" aria-label="회의실" hidden></section>
    <section class="view view-workshop" id="view-workshop" role="tabpanel" aria-label="부서" hidden></section>
    <section class="view view-status" id="view-status" role="tabpanel" aria-label="결재현황" hidden></section>
    <section class="view view-memo" id="view-memo" role="tabpanel" aria-label="지시메모" hidden></section>
  </main>

</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">제목</h2>
    <button type="button" class="icon-btn sheet-close" id="sheetClose" data-act="close-sheet" aria-label="닫기">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/mqtt-lite.js?v=20261129b"></script>
<script src="js/net.js?v=20261129b"></script>
<script src="js/app.js?v=20261129b"></script>
</body>
</html>
